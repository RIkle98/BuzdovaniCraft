<script src="script.js"></script>
<script>
(function () {
  // Ovdje se dodaju slike: [putanja, opis]. Prva je mala slika na stranici.
  var IMGS = [
    ["image/launcher/launcher-main.png", "Buzz Launcher: glavni prozor"],
    ["image/launcher/launcher-settings.png", "Buzz Launcher: podešavanja"],
    ["image/launcher/launcher-vt.jpeg", "VirusTotal: 0/63"]
  ];
  var row = document.getElementById("galRow");
  if (!row || !IMGS.length) return;
  IMGS.forEach(function (it, i) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "gal-thumb";
    b.setAttribute("aria-label", it[1]);
    var ti = document.createElement("img");
    ti.src = it[0];
    ti.alt = it[1];
    b.appendChild(ti);
    b.addEventListener("click", function () { open(i); });
    row.appendChild(b);
  });

  var lb = document.createElement("div");
  lb.className = "lb";
  lb.innerHTML =
    '<button type="button" class="lb-x" aria-label="Zatvori">&times;</button>' +
    '<button type="button" class="lb-nav lb-prev" aria-label="Prethodna">&#8249;</button>' +
    '<img class="lb-img" alt="">' +
    '<button type="button" class="lb-nav lb-next" aria-label="Sljedeća">&#8250;</button>' +
    '<div class="lb-count"></div>';
  document.body.appendChild(lb);
  var img = lb.querySelector(".lb-img");
  var count = lb.querySelector(".lb-count");
  var prev = lb.querySelector(".lb-prev");
  var next = lb.querySelector(".lb-next");
  var cur = 0;

  function show(i) {
    cur = (i + IMGS.length) % IMGS.length;
    img.src = IMGS[cur][0];
    img.alt = IMGS[cur][1];
    count.textContent = (cur + 1) + " / " + IMGS.length + "  " + IMGS[cur][1];
  }
  function open(i) {
    show(i);
    prev.style.display = next.style.display = IMGS.length > 1 ? "" : "none";
    lb.classList.add("show");
  }
  function close() { lb.classList.remove("show"); }

  // klik na sličicu je vezan gore, u petlji
  prev.addEventListener("click", function (e) { e.stopPropagation(); show(cur - 1); });
  next.addEventListener("click", function (e) { e.stopPropagation(); show(cur + 1); });
  lb.querySelector(".lb-x").addEventListener("click", close);
  lb.addEventListener("click", function (e) { if (e.target === lb) close(); });
  document.addEventListener("keydown", function (e) {
    if (!lb.classList.contains("show")) return;
    if (e.key === "Escape") close();
    else if (e.key === "ArrowLeft") show(cur - 1);
    else if (e.key === "ArrowRight") show(cur + 1);
  });
})();
</script>
