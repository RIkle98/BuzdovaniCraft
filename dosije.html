<link rel="icon" type="image/png" href="image/favicon/favicon.png">
<style>
  .dp { position: relative; overflow: hidden; min-height: 100vh; }
  .dp::before {
    content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(55% 45% at 85% 10%, rgba(232,144,58,.15), transparent 70%),
      radial-gradient(45% 40% at 5% 95%, rgba(232,144,58,.08), transparent 70%);
  }
  .dp-wrap { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding: 120px 40px 60px; }
  .dp-tag { display: inline-block; padding: 6px 14px; margin-bottom: 18px; font-size: 14px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ember); border: 1px solid var(--line); border-radius: 999px; }
  .dp-title { font-family: "Pixelify Sans", system-ui, sans-serif; font-weight: 700; font-size: clamp(38px, 5vw, 64px); line-height: 1.05; }
  .dp-title span { color: var(--ember); }
  .dp-lead { margin-top: 14px; max-width: 60ch; font-size: 19px; color: var(--muted); }

  .dp-bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin: 30px 0 16px; }
  .dp-search { position: relative; flex: 1; max-width: 420px; min-width: 220px; }
  .dp-search input { width: 100%; font: inherit; font-size: 17px; padding: 12px 16px 12px 44px; color: var(--text); background: var(--ink-soft); border: 1px solid var(--line); border-radius: 999px; -webkit-user-select: text; user-select: text; transition: border-color .3s ease; }
  .dp-search input:focus { outline: none; border-color: var(--ember); }
  .dp-search svg { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .dp-count { font-size: 15px; color: var(--muted); }

  .dp-card { background: var(--ink-soft); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; box-shadow: 0 24px 70px rgba(0,0,0,.3); }
  .dp-table { width: 100%; border-collapse: collapse; }
  .dp-table th { padding: 14px 16px; text-align: left; font-size: 14px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); }
  .dp-table td { padding: 14px 16px; font-size: 16px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .dp-table tbody tr:last-child td { border-bottom: 0; }
  .dp-table tbody tr:hover td { background: rgba(232,144,58,.05); }
  .dp-player { font-weight: 600; }
  .dp-reason { max-width: 320px; word-break: break-word; }
  .dp-date { white-space: nowrap; color: var(--muted); }
  .dp-badge { display: inline-block; margin-left: 8px; padding: 2px 9px; font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; border-radius: 999px; border: 1px solid var(--line); vertical-align: middle; }
  .dp-badge.ban { color: #ff7a6b; border-color: rgba(255,122,107,.5); }
  .dp-badge.mute { color: #e8c23a; border-color: rgba(232,194,58,.5); }
  .dp-badge.kick { color: #6bb7ff; border-color: rgba(107,183,255,.5); }
  .dp-badge.warn { color: #b9afa3; border-color: rgba(185,175,163,.5); }
  .dp-empty { padding: 40px 16px; text-align: center; color: var(--muted); font-size: 17px; }

  .dp-pager { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 22px; flex-wrap: wrap; }
  .dp-pager button { min-width: 42px; height: 42px; padding: 0 14px; font: inherit; font-weight: 600; font-size: 16px; color: var(--text); background: transparent; border: 1px solid var(--line); border-radius: 999px; cursor: pointer; transition: border-color .3s ease, color .3s ease, background .3s ease; }
  .dp-pager button:hover:not(:disabled) { border-color: var(--ember); color: var(--ember); }
  .dp-pager button.on { background: var(--ember); border-color: var(--ember); color: #1a1209; }
  .dp-pager button:disabled { opacity: .4; cursor: default; }
  .dp-dots { color: var(--muted); padding: 0 4px; }

  @media (max-width: 760px) {
    .dp-wrap { padding: 96px 16px 40px; }
    .dp-table thead { display: none; }
    .dp-table, .dp-table tbody, .dp-table tr, .dp-table td { display: block; width: 100%; }
    .dp-table tr { padding: 14px 16px; border-bottom: 1px solid var(--line); }
    .dp-table tbody tr:last-child { border-bottom: 0; }
    .dp-table td { padding: 3px 0; border: 0; }
    .dp-table td[data-l]::before { content: attr(data-l) ": "; color: var(--muted); font-size: 14px; }
    .dp-table td.dp-first { font-size: 18px; padding-bottom: 6px; }
    .dp-table td.dp-first::before { content: none; }
    .dp-reason { max-width: none; }
  }
</style>
</head>
<body>

<nav class="nav">
  <a href="index.html">Početna</a>
  <div class="dd">
    <a href="#" class="dd-toggle">Rankovi &#9662;</a>
    <div class="dd-menu">
      <div class="dd-box">
        <a href="#">Global</a>
        <a href="#">KitPvP</a>

      </div>

  </div>

  <a href="vote.html">Vote</a>
  <a href="dosije.html" class="active">Dosije Službe</a>
  <a href="launcher.html" class="nav-launcher">Buzz Launcher</a>
</nav>

<main class="dp">
  <div class="dp-wrap">
    <span class="dp-tag">Evidencija kazni</span>
    <h1 class="dp-title">Dosije <span>Službe</span></h1>
    <p class="dp-lead">Svaka kazna koju igrač dobije na bilo kom serveru se evidentira. Najnovije su prve. Traži igrača po nicku.</p>

    <div class="dp-bar">
      <label class="dp-search">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input type="text" id="dpQ" maxlength="16" placeholder="Pretraži po nicku" autocomplete="off" spellcheck="false">
      </label>
      <div class="dp-count" id="dpCount"></div>
    </div>

    <div class="dp-card">
      <table class="dp-table">
        <thead><tr><th>Igrač</th><th>Server</th><th>Admin</th><th>Razlog</th><th>Trajanje</th><th>Datum</th></tr></thead>
        <tbody id="dpBody"></tbody>
      </table>
    </div>
    <div class="dp-pager" id="dpPager"></div>
  </div>
</main>

<script src="script.js"></script>
<script>
(function () {
  var API = "https://api.buzdovanicraft.com";
  var body = document.getElementById("dpBody");
  var pager = document.getElementById("dpPager");
  var count = document.getElementById("dpCount");
  var input = document.getElementById("dpQ");
  var q = "", page = 1, timer = null, seq = 0;

  function msgRow(t) {
    body.innerHTML = "";
    var tr = document.createElement("tr");
    var td = document.createElement("td");
    td.colSpan = 6;
    td.className = "dp-empty";
    td.textContent = t;
    tr.appendChild(td);
    body.appendChild(tr);
  }
  function cell(tr, text, cls, label) {
    var td = document.createElement("td");
    if (cls) td.className = cls;
    if (label) td.setAttribute("data-l", label);
    td.textContent = text;
    tr.appendChild(td);
    return td;
  }
  function render(d) {
    body.innerHTML = "";
    count.textContent = d.total ? "Ukupno: " + d.total : "";
    if (!d.items.length) { msgRow(q ? "Nema kazni za tog igrača." : "Još nema evidentiranih kazni."); return; }
    d.items.forEach(function (it) {
      var tr = document.createElement("tr");
      var first = cell(tr, it.player, "dp-player dp-first");
      var b = document.createElement("span");
      b.className = "dp-badge " + (["ban", "mute", "kick", "warn"].indexOf(it.type) >= 0 ? it.type : "");
      b.textContent = it.type;
      first.appendChild(b);
      cell(tr, it.server, "", "Server");
      cell(tr, it.admin, "", "Admin");
      cell(tr, it.reason || "-", "dp-reason", "Razlog");
      cell(tr, it.duration || "-", "", "Trajanje");
      cell(tr, it.date, "dp-date", "Datum");
      body.appendChild(tr);
    });
  }
  function pageBtn(label, p, opts) {
    var b = document.createElement("button");
    b.type = "button";
    b.textContent = label;
    if (opts && opts.on) b.className = "on";
    if (opts && opts.dis) b.disabled = true;
    else b.addEventListener("click", function () { page = p; load(); window.scrollTo({ top: 0, behavior: "smooth" }); });
    pager.appendChild(b);
  }
  function dots() {
    var s = document.createElement("span");
    s.className = "dp-dots";
    s.textContent = "...";
    pager.appendChild(s);
  }
  function renderPager(cur, total) {
    pager.innerHTML = "";
    if (total <= 1) return;
    pageBtn("\u2039", cur - 1, { dis: cur <= 1 });
    var from = Math.max(1, cur - 2), to = Math.min(total, cur + 2);
    if (from > 1) { pageBtn("1", 1); if (from > 2) dots(); }
    for (var i = from; i <= to; i++) pageBtn(String(i), i, { on: i === cur });
    if (to < total) { if (to < total - 1) dots(); pageBtn(String(total), total); }
    pageBtn("\u203A", cur + 1, { dis: cur >= total });
  }
  function load() {
    var my = ++seq;
    fetch(API + "/punishments?q=" + encodeURIComponent(q) + "&page=" + page)
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (my !== seq) return;
        if (!d.ok) { msgRow("Previše zahtjeva, probaj za minut."); pager.innerHTML = ""; return; }
        page = d.page;
        render(d);
        renderPager(d.page, d.pages);
      })
      .catch(function () { if (my === seq) { msgRow("Server nije dostupan, probaj kasnije."); pager.innerHTML = ""; } });
  }
  input.addEventListener("input", function () {
    clearTimeout(timer);
    timer = setTimeout(function () { q = input.value.trim(); page = 1; load(); }, 500);
  });
  load();
})();
</script>
</body>
</html>
